[GNSS-SDR]
; --- GLOBAL SETTINGS ---
GNSS-SDR.internal_fs_sps=2600000

[SignalSource]
implementation=File_Signal_Source
; IMPORTANT: Make sure this path is correct!
filename=/mnt/c/gps_test/simulation.bin
item_type=byte
sampling_frequency=2600000
samples=0

[SignalConditioner]
implementation=Signal_Conditioner
sample_freq_in=2600000
sample_freq_out=2600000

[Channel0]
implementation=Channel
[Channel1]
implementation=Channel
[Channel2]
implementation=Channel
[Channel3]
implementation=Channel
[Channel4]
implementation=Channel
[Channel5]
implementation=Channel
[Channel6]
implementation=Channel
[Channel7]
implementation=Channel

[Acquisition_1C]
implementation=GPS_L1_CA_PCPS_Acquisition
doppler_max=10000
doppler_step=250

[Tracking_1C]
implementation=GPS_L1_CA_DLL_PLL_Tracking
pll_bw_hz=40.0;
dll_bw_hz=4.0;

[Telemetry_1C]
implementation=GPS_L1_CA_Telemetry_Decoder

[Observables]
implementation=GPS_L1_CA_Observables

[PVT]
implementation=Rinex_Printer
rinex_version=3
; Output will be saved to the current folder
output_filename=rover_simulated.obs
