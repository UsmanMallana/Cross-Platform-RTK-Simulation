; GNSS-SDR v0.0.19 SAFE CONFIG
[GNSS-SDR]
GNSS-SDR.internal_fs_sps=4000000

[SignalSource]
SignalSource.implementation=File_Signal_Source
SignalSource.filename=/mnt/c/gps_test/simulation_standard.bin
SignalSource.item_type=ishort
SignalSource.sampling_frequency=4000000
SignalSource.samples=0

[SignalConditioner]
SignalConditioner.implementation=Signal_Conditioner
SignalConditioner.sample_freq_in=4000000
SignalConditioner.sample_freq_out=4000000

[DataTypeAdapter]
DataTypeAdapter.implementation=Ishort_To_Complex

[InputFilter]
InputFilter.implementation=Pass_Through
InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex

[Channel0]
implementation=Channel
[Channel1]
implementation=Channel
[Channel2]
implementation=Channel
[Channel3]
implementation=Channel
[Channel4]
implementation=Channel
[Channel5]
implementation=Channel
[Channel6]
implementation=Channel
[Channel7]
implementation=Channel

[Acquisition_1C]
implementation=GPS_L1_CA_PCPS_Acquisition
doppler_max=10000
doppler_step=250

[Tracking_1C]
implementation=GPS_L1_CA_DLL_PLL_Tracking
pll_bw_hz=40.0
dll_bw_hz=4.0

[Telemetry_1C]
implementation=GPS_L1_CA_Telemetry_Decoder

[Observables]
# The Fix: Use Standard Observables to allow RINEX printing
implementation=GPS_L1_CA_Observables

[PVT]
implementation=Rinex_Printer
rinex_version=3
output_filename=/mnt/c/gps_test/rover_simulated.obs
